  open_gaps_not_closed:
  - gap: R3 staleness limit
    ref: OI-5, RT-005
    why: entity_schema_3.0.json defines no limit - no number, no unit, no reference. Verified directly
      at v2.0.0.
    consequence: R3 cannot be granted by this suite on the freshness dimension at all.
  - gap: range-type internal shape
    ref: OI-4, VT-005B
    why: The schema declares value_type range for two parameters and never defines its structure.
    consequence: VT-005 can assert container type only. Both affected parameters are OPTIONAL, so low
      consequence today.
  - gap: pre-promotion metadata absence
    ref: OI-10, OI-14, TL-001B, TL-008
    why: compiled_on and compiled_by are stamped at promotion, but nothing in the record distinguishes
      a legitimate pre-promotion draft from a promoted record that lost its stamps.
    consequence: TL-001B reports absence at info severity and cannot tell the two cases apart. TL-008
      catches only the incoherent combination of missing stamps plus a declared R2/R3.
  - gap: R2 and R3 partially unverifiable after calibration exclusion
    ref: OI-13, RT-003, RT-004, RT-010
    why: The schema's R2 definition includes calibration coherence and its R3 definition includes held-out
      anchors; both are out of scope for this run by direction.
    consequence: R2 verified on 4 of 5 clauses, R3 on 1 of 3. Seven v1.1.0 tests were removed, including
      XF-005, which caught an anchor being used to both fit and test a parameter - the failure mode that
      produces a validation result looking like a successful fit while the model reproduces its own input.
  - gap: RR3 escalation-marker clause has no operative effect at R1
    ref: OI-11, CC-002, CC-002B
    why: RR3's "ONLY IF" phrasing implies an unmarked field hard-fails at R1, but the following sentence
      states it is a warning at R1, and the R2 clause fails both cases regardless.
    consequence: Implemented per the later, unambiguous sentence - warn either way at R1, under distinct
      finding codes. If strictness was intended, CC-002B must be raised to fail and this suite is currently
      under-strict at R1.
  - gap: SQS versus INV12 shipped constants
    ref: OI-12, SQS-006
    why: SQS1 and SQS5 require a source_quote for every non-null value; INV12 says the four class-typical
      constants are shipped pre-populated and not re-researched.
    consequence: If those constants ship without source_quotes, every catalog record fails SQS-001 and
      SQS-005 on four paths for reasons unrelated to the author's work. Implemented without a carve-out,
      as specified, and flagged.
  - gap: source_quote and conflicting are not schema-declared
    ref: OI-15
    why: Verified directly - neither string appears anywhere in entity_schema_3.0.json.
    consequence: The six SQS tests and CC-010 test fields catalog.py does not know about. A SQS failure
      is a requirements failure, not a schema-conformance failure, and the two should not be reported
      as the same thing.
  - gap: air_density_kg_m3 unclassified by RR4
    ref: OI-2, CC-009
    why: RR4 enumerates nine REQUIRED_MODELING paths; the schema declares ten.
    consequence: The tenth is checked under the generic REQUIRED_MODELING rule only, at warn level.
  - gap: segment attribution is asserted, never verified
    ref: XF-016 (OI-16 closed at v2.2.0)
    why: 'The suite asserts the segment recorded in its header. It cannot check that header value is right,
      and the coverage plan registers both a defense and a commercial segment under the identical category
      string "UAS - Group 1 - Quadcopter".

      '
    consequence: 'A wrong segment_id fails no test here - it passes XF-010, XF-013 and TL-006 - and miscounts
      two segments at once. Not currently live: at v2.2.0 the X2D (defense variant) and SEG-US-DEF-2020S-QUAD-G1
      (defense segment) agree, so this is a standing check. It WAS live at v2.1.0, which is the evidence
      that a variant change can invalidate it silently.

      '
  - gap: configuration provenance
    ref: OI-1, XF-014
    why: The scope declares the record represents the X2D in standard configuration on the stock battery,
      and that X2E or alternate-configuration sources are conflicts rather than fills. Detecting that
      requires reading the source behind a value.
    consequence: 'A record populated entirely from X2E sources passes every test in this suite. Sharpened
      by four identity changes - any value researched during the X2DENTERPRISE or X2E windows is a wrong-aircraft
      value unless re-confirmed against X2D sources. Human review at promotion is the only control.

      '
