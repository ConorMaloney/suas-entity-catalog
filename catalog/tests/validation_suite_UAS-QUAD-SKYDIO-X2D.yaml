  runner_executable_note: 62 tests target the record and are directly executable. 3 target the runner
    report, 3 lint this suite, 2 require source inspection, 7 are human review at promotion.
explicitly_out_of_scope:
- Whether any sourced value is factually correct. A record can pass every test above and state the wrong
  mass.
- Whether a source_quote is authentic, real, or supports the value it sits beside. Only its structural
  shape is tested. See SQS-006.
- Whether a cited source actually supports the value cited to it. SC-004, CC-004, CC-005 and CC-005B check
  that a source or note string EXISTS and is non-empty. None reads it.
- Whether the aerodynamic_assumptions literature values are the right modelling choices. CC-003 and CC-004
  confirm they carry an acceptable confidence tier and a source. The choice is not graded.
- CALIBRATION, entirely - presence, block structure, anchor existence, fitted-versus-held-out separation,
  and fit accuracy. Out of scope for this run by direction. See OI-13.
- Tier 2 conventions - conflict structure, source quote authenticity, unit-pairing correctness, conditions
  blocks, escalation marker format, source budgets.
- Whether the record's values came from sources describing the declared configuration - i.e. the X2D rather
  than the X2E. See OI-1 and XF-014.
- Whether the declared segment_id is the correct segment for this entity. The suite checks a segment is
  declared and matches the scope, never that the scope is right. See OI-16 and XF-016.
- R3 staleness. See OI-5 and RT-005.
